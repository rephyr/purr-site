name: pages

# Builds the site (the docs pages come from purr's own Markdown) and publishes it on GitHub Pages.
# Runs on every push here, by hand, and once a day so the docs follow purr's main branch.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: rephyr/purr
          path: purr
          fetch-depth: 0  # build.py dates each docs page from its last commit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown-it-py
      - run: PURR_DIR=purr PURR_REF=HEAD python build.py  # the checkout above is purr's main
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
